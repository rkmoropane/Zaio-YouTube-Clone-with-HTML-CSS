<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-videocard-filling.css">
    <title>Video Card Filling | Challenge</title>
</head>
<body>
    <div class="videos">
    <div class="video-grid">
        <div class="video">
        <div class="thumbnail">
            <img
            src="https://img.youtube.com/vi/Lu5VOe1FOco/sddefault.jpg"
            alt=""
            class="thumbnail-img"
            />
        </div>
        <div class="details">
            <div class="logo">
            <img
                src="https://yt3.ggpht.com/TtoYXLkyKZu3EDOHAbLjhtpPKwW9eBa0vKacVOmFfq4qzG_Si5KHqzS_u86KO1VIoZJp11scbw=s48-c-k-c0x00ffffff-no-rj"
                alt=""
                class="logo-img"
            />
            </div>
            <div class="video-details">
            <p class="title">SD Card PRO Ultimate: highlight | Samsung</p>
            <div class="posted-by">
                <span class="channel">Samsung</span>
                <div class="views-date">
                <span class="views">204k Views</span>
                <span class="dot">.</span>
                <span class="time">6 month ago</span>
                </div>
            </div>
            </div>
        </div>
        </div>
    </div>
    </div> 
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"> <!-- From Materialize CSS Icons. https://materializecss.com/icons.html and m2.material.io to search google icons -->
    <link rel="stylesheet" href="style.css">
    <title>YouTube</title>
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <i class="material-icons">view_headline</i>
            <img src="https://www.vectorlogo.zone/logos/youtube/youtube-ar21.svg" alt="">
        </div>
        <div class="searchbar">
            <form class="search">
                <input type="text" placeholder="Search">
                <button><i class="material-icons">search</i></button>
            </form>
            <i class="material-icons">keyboard_voice</i>
        </div>
        <div class="navigation-icons">
            <i class="material-icons">video_call</i>
            <i class="material-icons">apps</i>
            <i class="material-icons">notifications</i>
            <i class="material-icons">account_circle</i>
        </div>
    </div>
    <div class="mainbody">
        <div class="categories">
            <div class="categories-section">
                <span class="category active">
                    <i class="material-icons">home</i>
                    Home
                </span>
                <span class="category">
                    <i class="material-icons">explore</i>
                    Explore
                </span>
                <span class="category">
                    <i class="material-icons">subscriptions</i>
                    Subscription
                </span>
            </div>
        </div>
        <div class="videos"></div>
    </div>
</body>
</html>
